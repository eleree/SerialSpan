name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, e.g. 0.1.0-beta.1 (manual runs upload artifacts only)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Build all distribution archives
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          go run ./cmd/package -version "$VERSION" -out dist
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Upload downloadable packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ShareSerial-${{ env.RELEASE_VERSION }}
          path: dist/${{ env.RELEASE_VERSION }}/
          if-no-files-found: error
          retention-days: 14
      - name: Create a draft prerelease
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.txt <<'NOTES'
          SerialSpan is the GitHub project name for the ShareSerial application. These are beta preview packages for self-hosted use on trusted LAN/VPN networks. The five-character share code identifies a session; it is not authentication. Do not expose the service directly to untrusted public networks.
          Windows: download the matching EXE and double-click it. No ZIP, runtime helper or startup script is required. First run configures the LAN address, unique HTTPS certificate and optional private-network firewall rule.
          Other Local computers must explicitly trust the public server certificate. Never distribute its private key.
          WebRTC direct connections are opportunistic and may fall back to the server relay; cross-network direct connectivity is not guaranteed. Remote ESP32 flashing is experimental: ESP32-C3 and interrupted-write recovery remain unverified. Windows data is stored under LOCALAPPDATA/ShareSerial; -licenses displays embedded notices. Other platforms include README.txt in their archives. Verify SHA256SUMS.txt. These binaries are not code-signed/notarized. See docs/ESP32_FLASHING.md for the hardware acceptance scope.
          Review the release criteria in ROADMAP.md before publishing this draft.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/"$RELEASE_VERSION"/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "SerialSpan $RELEASE_VERSION" --notes-file release-notes.txt
