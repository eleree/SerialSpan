name: Beta feedback
description: Share structured feedback from a real embedded serial workflow.
title: "[Beta feedback] "
body:
  - type: markdown
    attributes:
      value: |
        SerialSpan is a self-hosted beta for trusted networks. This issue will be public.
        Do not include serial contents, share codes, public or private IP addresses, certificate files or fingerprints, tokens, or device serial numbers.
        For a security vulnerability, follow [SECURITY.md](https://github.com/eleree/SerialSpan/blob/main/SECURITY.md) instead.
  - type: dropdown
    id: workflow
    attributes:
      label: What did you try?
      options:
        - Remote serial receive or send
        - Remote serial parameter change
        - Direct P2P or server relay
        - Weak-network recovery or RX backfill
        - Remote ESP32 flashing (experimental)
        - Windows single-file application
        - Other
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Completed the task
        - Completed with a workaround
        - Partially completed
        - Could not complete
        - Could not get started
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Connection route, if known
      options:
        - WebRTC direct
        - Server relay
        - Switched between direct and relay
        - Unknown
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Local and Remote OS/browser, serial adapter or board, and baud rate where relevant. Do not include device identifiers.
      placeholder: "Local: Windows 11, Chrome ...; Remote: ...; board/adapter: ...; baud: ..."
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task and steps
      description: What were you trying to do? Include the shortest steps that reproduce the outcome.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual outcome
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant system diagnostics, if any
      description: Share only the minimum relevant system log lines after redacting identifiers. Never attach serial RX/TX data or certificates.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed serial contents, share codes, addresses, certificates, tokens, and device serial numbers.
          required: true
